name: Update release notes

# Rewrites the notes of every existing GitHub release from its section of CHANGELOG.md
# (run it from the Actions tab after editing the changelog).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            python3 tools/release_notes.py "$tag" > notes.md
            gh release edit "$tag" --notes-file notes.md
            echo "updated $tag"
          done
