name: Release

# Publishes dist/vintagee_<version>.zip as a GitHub release, either when a tag like v1.0.0 is pushed
# or when you press "Run workflow" on the Actions tab (it then uses the version in modinfo.json).
# If that version is already released, its zip and notes are replaced instead.
# The release notes are that version's section of CHANGELOG.md.
# (The mod can't be compiled in CI without the game's DLLs, so the zip is built locally with
# build/package.sh and committed to dist/ first.)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the zip for this tag
        id: zip
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(python3 -c "import json;print(json.load(open('modinfo.json'))['version'])")
          fi
          file="dist/vintagee_${version}.zip"
          if [ ! -f "$file" ]; then
            echo "::error::$file not found - build it with build/package.sh and commit it to dist/ before tagging"
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.zip.outputs.version }}"
          file="${{ steps.zip.outputs.file }}"
          python3 tools/release_notes.py "$version" > notes.md
          if gh release view "v$version" > /dev/null 2>&1; then
            # This version is already released (something was added to it): replace its zip and notes.
            gh release upload "v$version" "$file" --clobber
            gh release edit "v$version" --notes-file notes.md
            echo "updated the existing v$version release"
          else
            gh release create "v$version" "$file" --target "$GITHUB_SHA" \
              --title "Vintage-E $version" \
              --notes-file notes.md
          fi
